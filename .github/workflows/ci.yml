name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: typecheck / lint / test / build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      # Foundry's `anvil` is required by the vitest EIP-3009 integration suite —
      # `prool` spawns an anvil instance and the beforeAll hook hangs (Hook
      # timed out in 30000ms) if the binary is missing on the runner.
      - name: Install Foundry (anvil)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      # Supply chain policy assertion (THREAT_MODEL.md §0.5 / Threat 0.1).
      # Catches operator drift in pnpm-workspace.yaml minimumReleaseAge —
      # if someone removes or downgrades the setting, the install step
      # below would silently start accepting freshly-published versions.
      # The shared composite action is the single source of truth (see
      # .github/actions/assert-supply-chain-policy/action.yml).
      - name: Assert supply chain policy
        uses: ./.github/actions/assert-supply-chain-policy

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (Biome)
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
