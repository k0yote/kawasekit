# pnpm 11+ reads build-script and other settings from this file
# (the package.json "pnpm" field is no longer honored).

# Workspace packages. The kawasekit root is published as `kawasekit`; the
# subdirectories below it under `examples/` are NOT published — they exist so
# users can `cd examples/<name> && pnpm install && pnpm dev` to see kawasekit
# in action without touching kawasekit itself.
packages:
  - "."
  - "examples/*"
  - "docs"

# esbuild ships a postinstall script that fetches its native binary; it is a
# transitive dependency of tsup and tsx and must be allowed to build.
allowBuilds:
  esbuild: true
  # Astro Starlight (docs/) uses sharp for image optimisation. Sharp ships
  # a postinstall script that downloads its native binary.
  sharp: true

# Supply chain policy — explicit, not relying on pnpm 11 client defaults.
# Blocks installation of any package version published less than 24 h ago.
# This is the first line of defence against newly-published malicious
# versions (the "yesterday's npm compromise" pattern). The CI workflows
# assert this value before `pnpm install` so operator drift is caught at
# build time, not at runtime.
#
# See `docs/THREAT_MODEL.md` §0.5 Layer 0 / Threat 0.1, and the upstream
# config reference at https://pnpm.io/settings#minimumreleaseage.
minimumReleaseAge: 1d
